[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbounty-hunter"
version = "1.0.0"
description = "Elite Bug Bounty Automation Suite for Ethical Security Testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "BugBountyHunter Team"}
]

dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    # HTTP
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    # DNS
    "dnspython>=2.4.0",
    # HTML/JS parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "jsbeautifier>=1.14.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    # Async
    "celery[redis]>=5.3.0",
    # Templating & reporting
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    # Security / crypto
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    # Data
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    # Utilities
    "rich>=13.7.0",
    "click>=8.1.0",
    "tldextract>=5.1.0",
    "python-whois>=0.8.0",
    "shodan>=1.31.0",
    # AI/ML
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
bbhunter = "bbhunter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bbhunter*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
